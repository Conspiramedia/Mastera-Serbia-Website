<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Подсказки загрузчику. Шрифты обнаруживаются только после разбора
       style.css (92 КБ) — до этого текст ждёт. Предзагружаем два самых
       частых начертания; medium и semibold подтянутся обычным порядком.
       hero-bg сознательно НЕ предзагружается: блок .hero лежит ниже
       первого экрана, и приоритетная загрузка отняла бы полосу у шрифтов. -->
  <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin>
  <link rel="preconnect" href="https://www.google-analytics.com" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-regular.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-bold.woff2" crossorigin>
  <meta name="facebook-domain-verification" content="paqn1cfrcp9penysikx71x7w6w755f" />

  <!-- Определяем язык и редиректим на нужную версию -->
  <script>
    (function() {
      // Редирект /index.html → /
      if (window.location.pathname.endsWith('/index.html')) {
        window.location.replace('/');
        return;
      }
      // Язык по умолчанию — сербский: домен .rs, 70–80% аудитории сербы,
      // на /sr/ же указывает hreflang x-default. Русский отдаём только
      // тем, у кого он реально в настройках браузера (релоканты — ценный,
      // но меньший сегмент), английский — англоязычным.
      var lang = navigator.language || navigator.userLanguage || 'sr';
      if (lang.startsWith('ru')) {
        window.location.replace('/ru/');
      } else if (lang.startsWith('en')) {
        window.location.replace('/en/');
      } else {
        window.location.replace('/sr/');
      }
    })();
  </script>

  <!-- meta refresh здесь намеренно НЕ используется: он уводил бы роботов на
       /ru/, тогда как hreflang x-default указывает на /sr/ (основная
       аудитория — сербы). Противоречие заставляет Google игнорировать
       разметку целиком. Робот читает ссылки RUS/SRB/ENG в теле страницы
       и hreflang, живой пользователь — JS-редирект выше. -->

  <!-- SEO — канонический URL и hreflang -->
  <title>Pravi Majstor — majstori u Srbiji</title>
  <meta name="description" content="Pravi Majstor — servis za izbor majstora u Srbiji. Vodoinstalater, električar, majstor za sve. Odgovor za 60 minuta.">

  <!-- Open Graph -->
  <meta property="og:title" content="Pravi Majstor — majstori u Srbiji">
  <meta property="og:description" content="Pravi Majstor — servis za izbor majstora u Srbiji. Vodoinstalater, električar, majstor za sve. Odgovor za 60 minuta.">
  <meta property="og:image" content="https://pravimajstor.rs/image/og-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="sr_RS">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pravi Majstor — majstori u Srbiji">
  <meta name="twitter:description" content="Pravi Majstor — servis za izbor majstora u Srbiji. Vodoinstalater, električar, majstor za sve. Odgovor za 60 minuta.">
  <meta name="twitter:image" content="https://pravimajstor.rs/image/og-preview.png">
  <link rel="canonical" href="https://pravimajstor.rs/">
  <meta name="robots" content="noindex, follow">
  <link rel="alternate" hreflang="ru" href="https://pravimajstor.rs/ru/">
  <link rel="alternate" hreflang="sr" href="https://pravimajstor.rs/sr/">
  <link rel="alternate" hreflang="en" href="https://pravimajstor.rs/en/">
  <link rel="alternate" hreflang="x-default" href="https://pravimajstor.rs/sr/">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
  <link rel="icon" type="image/x-icon" href="image/favicon.ico">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FDB913">

  <!-- Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pravi Majstor">
  <link rel="apple-touch-icon" href="image/web-app-manifest-192x192.png">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7SLML317LT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7SLML317LT');
  </script>

  <style>
    body { margin: 0; background: #1a1a1a; color: #fff; font-family: sans-serif;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .loader { text-align: center; }
    .loader p { opacity: 0.6; font-size: 14px; margin-top: 12px; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(253,185,19,0.3);
               border-top-color: #FDB913; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .links { margin-top: 20px; display: flex; gap: 12px; justify-content: center; }
    .links a { color: #FDB913; text-decoration: none; font-size: 13px;
                border: 1px solid #FDB913; padding: 4px 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Мастера в Белграде / Majstori u Beogradu / Masters in Belgrade</p>
    <div class="links">
      <a href="/ru/">RUS</a>
      <a href="/sr/">SRB</a>
      <a href="/en/">ENG</a>
    </div>
  </div>

  <!-- PWA (баннер установки + регистрация Service Worker) подключены на самих
       языковых страницах /ru/, /sr/, /en/ — этот корневой index.html мгновенно
       редиректит на язык и не успел бы ничего показать. -->
</body>
</html>
